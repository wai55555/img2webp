[package]
name = "img2webp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Convert PNG/GIF (and optionally JPEG) images to WebP while preserving metadata"
license = "MIT"
build = "build.rs"

[features]
default = ["dev-db"]
dev-db = []

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libwebp-sys = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
filetime = "0.2"
flate2 = "1"
lcms2 = "6"
sysinfo = "0.37"
jpeg-decoder = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "unwind"

[dev-dependencies]
filetime = "0.2"
