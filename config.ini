[paths]
input_dir = inputs
output_dir = outputs

[webp]
quality = 90

[animation]
missing_duration_ms = 80

[copy]
jpeg = true
avif = true
webp = true
other_files = true

[output]
overwrite_existing = true
reuse_unchanged = true
adopt_untracked = false
db_commit_every = 32

[preserve]
metadata = true
timestamps = true
# Stealth PNG Info の読み取り（false で無効）
stealth = true
# これを超える画素数の 16bit PNG は Stealth 走査を省略（0 は無制限）
stealth_max_pixels = 16777216
